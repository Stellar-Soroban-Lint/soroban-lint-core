[workspace]
resolver = "2"
members = ["soroban-lint-core", "soroban-lint-cli", "soroban-lint-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Stellar-Soroban-Lint/soroban-lint-core"
homepage = "https://github.com/Stellar-Soroban-Lint/soroban-lint-core"

[workspace.dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
