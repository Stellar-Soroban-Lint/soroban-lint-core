[package]
name = "soroban-lint-wasm"
# Not a crates.io crate: the wasm-pack output is consumed as a release asset.
publish = false
description = "WebAssembly bindings for soroban-lint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# `wasm-opt` is applied separately in the release workflow; the build must not
# depend on downloading binaryen at package time.
wasm-opt = false

[dependencies]
soroban-lint-core = { path = "../soroban-lint-core", version = "0.1.1" }
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
serde_json.workspace = true
