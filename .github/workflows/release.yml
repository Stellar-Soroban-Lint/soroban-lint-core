name: Release

# Builds the `soroban-lint` CLI for each supported runner platform and publishes
# the archives (plus SHA-256 checksums) as release assets. `soroban-lint-action`
# downloads an asset from here and verifies its checksum before running it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-14 # Apple silicon; also cross-builds the x86_64 target.
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install the aarch64 Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p soroban-lint-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="soroban-lint-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "pack/${name}" dist
          cp "target/${{ matrix.target }}/release/soroban-lint" "pack/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "pack/${name}/"
          tar -C pack -czf "dist/${name}.tar.gz" "${name}"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "soroban-lint-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "pack/$name" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/soroban-lint.exe" "pack/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "pack/$name/"
          Compress-Archive -Path "pack/$name" -DestinationPath "dist/$name.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          # Only the archive: the staging directory must not be uploaded, or it
          # reappears in the release job and gh tries to attach a directory.
          path: dist/
          if-no-files-found: error

  wasm:
    name: wasm-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack and binaryen
        run: |
          set -euo pipefail
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build the wasm package
        run: wasm-pack build soroban-lint-wasm --target web --release --out-dir pkg

      - name: Optimize with wasm-opt
        run: |
          set -euo pipefail
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            -o soroban-lint-wasm/pkg/soroban_lint_wasm_bg.wasm \
            soroban-lint-wasm/pkg/soroban_lint_wasm_bg.wasm

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="soroban-lint-wasm-${RELEASE_TAG}"
          mkdir -p "pack/${name}" dist
          cp -r soroban-lint-wasm/pkg/. "pack/${name}/"
          tar -C pack -czf "dist/${name}.tar.gz" "${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wasm
          path: dist/
          if-no-files-found: error

  release:
    name: publish
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo "::error::a directory leaked into dist/; release assets must be files only"
            ls -l dist
            exit 1
          fi
          cd dist
          for archive in *.tar.gz *.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done
          sha256sum --check --strict ./*.sha256
          ls -l

      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Prebuilt `soroban-lint` binaries for each supported platform
          (`x86_64`/`aarch64` Linux, `x86_64`/`aarch64` macOS, `x86_64` Windows).

          Every archive ships with a sibling `.sha256` file. Verify it before running the binary:

          The `soroban-lint-wasm-*.tar.gz` asset is the `wasm-pack --target web` package the portal
          consumes (`soroban_lint_wasm.js`, the typings, and the `wasm-opt -Oz` binary).

          ```bash
          sha256sum --check <archive>.sha256
          ```

          soroban-lint performs syntactic, per-file analysis of Soroban contract source using the Rust AST. It flags patterns associated with missing authorization checks, panic paths, unchecked arithmetic, and storage hazards in `#[contractimpl]` functions. It does not expand macros, resolve types, or follow calls across files, so it can miss real issues (false negatives) and flag safe code (false positives). A clean report is not evidence a contract is secure, and this tool is not a substitute for an audit.
          EOF
          cat notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # This job has no checkout, so the repository must be passed explicitly.
          repo="$GITHUB_REPOSITORY"
          if gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --repo "$repo" --clobber
            gh release edit "$RELEASE_TAG" --repo "$repo" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$repo" \
              --title "$RELEASE_TAG" \
              --notes-file notes.md
          fi
